name: Validate local AI grader

on:
  push:
    paths:
      - "local_ai_grader/**"
      - ".github/workflows/validate-ai-grader.yml"
  pull_request:
    paths:
      - "local_ai_grader/**"
      - ".github/workflows/validate-ai-grader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m py_compile local_ai_grader/app.py
