name: Validate local AI grader

on:
  push:
    paths:
      - "local_ai_grader/**"
      - ".github/workflows/validate-ai-grader.yml"
  pull_request:
    paths:
      - "local_ai_grader/**"
      - ".github/workflows/validate-ai-grader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r local_ai_grader/requirements.txt
      - name: Compile Python files
        run: |
          python -m py_compile local_ai_grader/app.py
          python -m py_compile local_ai_grader/media_analysis.py
      - name: Verify analysis modules import
        working-directory: local_ai_grader
        run: python -c "import media_analysis; print('Media analysis dependencies imported successfully')"
      - name: Run media analysis unit tests
        working-directory: local_ai_grader
        run: python -m unittest discover -p "test_*.py" -v
